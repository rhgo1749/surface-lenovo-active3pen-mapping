name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64:
    name: Windows 11 ARM64
    runs-on: windows-11-vs2026-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A ARM64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: surface-pen-map-arm64
          path: build/Release/surface-pen-map.exe
          if-no-files-found: error
